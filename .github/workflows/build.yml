
name: Build RED CITY PS2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build PS2 game
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            ps2dev/ps2dev:latest \
            sh -c "apk add --no-cache make && make clean && make && cp RED_CITY.ELF RED_CITY_GAME.ELF && make clean && make EE_BIN=RED_CITY_RENDER_TEST.ELF EE_OBJS='src/main_render_test.o src/nexon_engine.o'"

      - name: Find build output
        if: always()
        run: |
          echo "Files in project:"
          find . -type f | head -100
          echo "ELF files:"
          find . -type f -iname "*.elf" -print

      - name: Upload possible ELF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RED-CITY-BUILD-OUTPUT
          path: |
            **/*.elf
            **/*.ELF
          if-no-files-found: warn
          
