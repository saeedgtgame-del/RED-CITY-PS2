
name: Build RED CITY PS2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Inspect PS2 build environment
        run: |
          docker run --rm ps2dev/ps2dev:latest sh -c '
            echo "Checking PS2 development environment..."
            echo "PATH=$PATH"
            echo ""
            echo "Checking make:"
            command -v make || true
            echo ""
            echo "Checking PS2 compiler:"
            command -v mips64r5900el-ps2-elf-gcc || true
            echo ""
            echo "Checking available tools:"
            ls /usr/bin/make /usr/local/bin/make 2>/dev/null || true
            echo ""
            echo "Environment inspection completed."
          '

      - name: Build status
        run: |
          echo "Environment inspection completed."
          echo "Waiting for build configuration."
          
