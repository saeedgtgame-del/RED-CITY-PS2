name: RED CITY clean rebuild

on:
  push:
    branches:
      - main
      - rebuild-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build PS2 ELF
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src ps2dev/ps2dev:latest sh -c "apk add --no-cache make && make clean && make"
      - name: Upload ELF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RED-CITY-REBUILD-V1
          path: RED_CITY.ELF
          if-no-files-found: warn
