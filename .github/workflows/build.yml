
name: Build RED CITY PS2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compile RED CITY
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            ps2dev/ps2dev:latest \
            sh -c "apk add --no-cache make && make"

      - name: Check ELF
        run: test -f RED_CITY.ELF

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: RED-CITY-PS2
          path: RED_CITY.ELF
          
