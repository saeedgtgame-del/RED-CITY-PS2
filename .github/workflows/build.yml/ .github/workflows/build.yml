
name: Build RED CITY PS2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PS2 development tools
        uses: docker://ps2dev/ps2dev:latest
        with:
          entrypoint: /bin/bash
          args: -lc "source /opt/ps2dev/ps2sdk/ee/eevars.sh && make"

      - name: Check output
        run: |
          ls -la
          test -f RED_CITY.ELF

      - name: Upload PS2 game
        uses: actions/upload-artifact@v4
        with:
          name: RED-CITY-PS2
          path: RED_CITY.ELF
          
